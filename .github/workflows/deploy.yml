name: CI/CD to Hugging Face Spaces

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true 

      - name: Fetch LFS files
        run: git lfs pull

      - name: Install Git Xet
        run: |
          # Download the official Linux x86_64 zip asset from the Hugging Face core repository
          curl -L -o git-xet.zip https://github.com/huggingface/xet-core/releases/download/git-xet-v0.2.1/git-xet-linux-x86_64.zip
          
          # Extract the naked executable
          unzip git-xet.zip
          
          # Position it directly in system path execution scope 
          sudo mv git-xet /usr/local/bin/
          
          # Verify system visibility and register hooks
          git xet install

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          git remote add hf https://x-token:$HF_TOKEN@huggingface.co/spaces/leadingedge9/multi-tool-agent
          git push --force hf main


 