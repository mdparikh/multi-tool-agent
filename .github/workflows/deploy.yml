name: CI/CD to Hugging Face Spaces

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true 

      - name: Fetch LFS files
        run: git lfs pull

      - name: Install Git Xet
        run: |
          # 1. Download the verified x86_64 Linux release binary from Hugging Face core repo
          curl -L -o git-xet.tar.gz https://github.com
          
          # 2. Extract it
          tar -xzf git-xet.tar.gz
          
          # 3. Move the binary directly into a standard system directory already in the path
          sudo mv git-xet /usr/local/bin/
          
          # 4. Verify it works and register it with Git globally
          git xet install

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          git remote add hf https://x-token:$HF_TOKEN@huggingface.co/spaces/leadingedge9/multi-tool-agent
          git push --force hf main


 